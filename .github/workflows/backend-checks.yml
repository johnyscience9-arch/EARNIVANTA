name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest==8.3.5 httpx==0.28.1
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Validate deployment assets
        run: |
          test -s render.yaml
          test -s backend/Dockerfile
          test -s backend/.env.example
          grep -q 'TOKEN_SECRET' render.yaml
          grep -q 'healthCheckPath: /api/v1/health' render.yaml
      - name: Build API container
        run: docker build -t earnivanta-api:ci backend
      - name: Import API and verify routes
        working-directory: backend
        run: |
          python -c "from app.main import app; paths={r.path for r in app.routes}; required={'/api/v1/health','/api/v1/auth/register','/api/v1/auth/login','/api/v1/auth/verify-email','/api/v1/auth/resend-verification','/api/v1/auth/forgot-password','/api/v1/auth/reset-password','/api/v1/auth/mfa/verify','/api/v1/auth/mfa/setup','/api/v1/auth/mfa/enable','/api/v1/auth/mfa/disable','/api/v1/me','/api/v1/admin/users','/api/v1/campaigns','/api/v1/campaigns/{campaign_id}/submit','/api/v1/admin/campaigns/{campaign_id}/review','/api/v1/admin/tasks/{task_id}/review','/api/v1/admin/review-queue','/api/v1/tasks/{task_id}/submissions','/api/v1/my/submissions','/api/v1/admin/submissions','/api/v1/admin/submissions/{submission_id}/review','/api/v1/wallet','/api/v1/wallet/transactions','/api/v1/withdrawals','/api/v1/admin/wallet/adjust','/api/v1/admin/withdrawals','/api/v1/admin/withdrawals/{withdrawal_id}/process','/api/v1/deposits','/api/v1/admin/deposits','/api/v1/admin/deposits/{deposit_id}/review','/api/v1/campaigns/{campaign_id}/fund','/api/v1/campaigns/{campaign_id}/budget'}; missing=required-paths; assert not missing, f'Missing routes: {missing}'; print('API import OK; required routes present')"
      - name: Run workflow tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Production API smoke and CORS security checks
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://earnivanta-api-ozq5.onrender.com"
          def request(path, method="GET", headers=None):
              req = urllib.request.Request(base + path, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, dict(response.headers), response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, dict(error.headers), error.read().decode("utf-8", "replace")

          status, headers, body = request("/api/v1/health")
          assert status == 200 and json.loads(body).get("ok") is True, (status, body)
          for name in ("content-security-policy", "x-frame-options", "x-content-type-options", "referrer-policy"):
              assert name in {key.lower() for key in headers}, f"Missing API security header: {name}"

          status, _, _ = request("/api/v1/me")
          assert status == 401, f"Unauthenticated member route returned {status}"
          status, _, _ = request("/api/v1/admin/users")
          assert status == 401, f"Unauthenticated admin route returned {status}"
          for path in ("/docs", "/redoc", "/openapi.json"):
              status, _, _ = request(path)
              assert status == 404, f"Production API docs still exposed at {path}: {status}"

          allowed = {
              "Origin": "https://earnivanta.pages.dev",
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type",
          }
          status, headers, _ = request("/api/v1/auth/login", "OPTIONS", allowed)
          assert status == 200, f"Allowed CORS preflight failed: {status}"
          assert headers.get("access-control-allow-origin") == allowed["Origin"], headers

          denied = dict(allowed, Origin="https://evil.example")
          status, headers, _ = request("/api/v1/auth/login", "OPTIONS", denied)
          assert status == 400, f"Unexpected disallowed-origin preflight status: {status}"
          assert "access-control-allow-origin" not in headers, headers
          print("Production API smoke passed: health, security headers, auth gates, docs disabled, CORS allow/deny.")
          PY
