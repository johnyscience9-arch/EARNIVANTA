name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest==8.3.5 httpx==0.28.1
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Validate deployment assets
        run: |
          test -s render.yaml
          test -s backend/Dockerfile
          test -s backend/.env.example
          grep -q 'TOKEN_SECRET' render.yaml
          grep -q 'healthCheckPath: /api/v1/health' render.yaml
      - name: Build API container
        run: docker build -t earnivanta-api:ci backend
      - name: Import API and verify routes
        working-directory: backend
        run: |
          python -c "from app.main import app; paths={r.path for r in app.routes}; required={'/api/v1/health','/api/v1/auth/register','/api/v1/auth/login','/api/v1/me','/api/v1/admin/users','/api/v1/campaigns','/api/v1/campaigns/{campaign_id}/submit','/api/v1/admin/campaigns/{campaign_id}/review','/api/v1/admin/tasks/{task_id}/review','/api/v1/admin/review-queue','/api/v1/tasks/{task_id}/submissions','/api/v1/my/submissions','/api/v1/admin/submissions','/api/v1/admin/submissions/{submission_id}/review','/api/v1/wallet','/api/v1/wallet/transactions','/api/v1/withdrawals','/api/v1/admin/wallet/adjust','/api/v1/admin/withdrawals','/api/v1/admin/withdrawals/{withdrawal_id}/process','/api/v1/deposits','/api/v1/admin/deposits','/api/v1/admin/deposits/{deposit_id}/review','/api/v1/campaigns/{campaign_id}/fund','/api/v1/campaigns/{campaign_id}/budget'}; missing=required-paths; assert not missing, f'Missing routes: {missing}'; print('API import OK; required routes present')"
      - name: Run workflow tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q
