name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Import API and verify routes
        working-directory: backend
        run: |
          python -c "from app.main import app; paths={r.path for r in app.routes}; required={'/api/v1/health','/api/v1/auth/register','/api/v1/auth/login','/api/v1/me','/api/v1/campaigns'}; missing=required-paths; assert not missing, f'Missing routes: {missing}'; print('API import OK; required routes present')"
