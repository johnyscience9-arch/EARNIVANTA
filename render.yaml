services:
  - type: web
    name: earnivanta-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: ADMIN_MFA_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: https://earnivanta.pages.dev
      - key: FRONTEND_URL
        value: https://earnivanta.pages.dev
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_NAME
        value: EARNIVANTA
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
