services:
  - type: web
    name: earnivanta-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: https://johnyscience9-arch.github.io
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
